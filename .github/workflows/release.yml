name: Release

# Trigger: push a tag like `v0.2.0` → builds every platform binary in
# parallel, attaches them to the GitHub Release by that tag. Operium Desktop
# and the Operium Orchestra VS Code extension pick assets by the names below
# (via release-manifests/<channel>.json, see runtime-channel-manifest.yml).
#
# Required (all must succeed or no release):
#   orchestra-runtime-darwin-arm64     Apple Silicon, Metal + Accelerate
#   orchestra-runtime-linux-x64        CPU (AVX2 baseline), glibc >= 2.35
#   orchestra-runtime-linux-arm64      CPU (armv8 baseline), glibc >= 2.35
#   orchestra-runtime-win32-x64.exe    CPU (AVX2 baseline), MinGW static link
#   + the matching orchestra-worker-* binary for subprocess mode
#
# Pull requests that touch the build run the same matrix without publishing,
# so a broken platform is caught before tagging.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "Makefile"
      - "llama.cpp"
      - "cmd/**"
      - "internal/engine/**"
      - "internal/supervisor/**"
  # Allow manual dispatch for dry-runs without tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0). Leave blank for a dry-run artifact."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # needed to create/update a Release and upload assets

jobs:
  # Release WILL NOT publish unless every platform below succeeds. CPU builds
  # disable GGML_NATIVE so the binary runs on any machine with the listed
  # baseline instead of only on the runner's CPU, and disable OpenMP so no
  # libgomp runtime has to be installed on the user's machine.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            make_target: build-metal
            cmake_extra: ""
            ext: ""
            artifact: orchestra-runtime-darwin-arm64
            worker_artifact: orchestra-worker-darwin-arm64
          - name: linux-x64
            runner: ubuntu-22.04
            make_target: build-cpu
            cmake_extra: "-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
            ext: ""
            artifact: orchestra-runtime-linux-x64
            worker_artifact: orchestra-worker-linux-x64
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            make_target: build-cpu
            cmake_extra: "-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF"
            ext: ""
            artifact: orchestra-runtime-linux-arm64
            worker_artifact: orchestra-worker-linux-arm64
          - name: win32-x64
            runner: windows-2022
            make_target: build-cpu
            cmake_extra: "-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
            ext: ".exe"
            artifact: orchestra-runtime-win32-x64.exe
            worker_artifact: orchestra-worker-win32-x64.exe

    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # cmake + clang already preinstalled on GitHub runners;
          # this is a no-op guard so the step is explicit.
          cmake --version

      # cgo needs gcc, so Windows builds use MinGW-w64 (UCRT) from MSYS2
      # rather than MSVC. path-type inherit keeps setup-go's `go` on PATH.
      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: runner.os != 'Windows'
        run: make ${{ matrix.make_target }} VERSION=${{ steps.ver.outputs.version }} LLAMA_CMAKE_EXTRA="${{ matrix.cmake_extra }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
        run: make ${{ matrix.make_target }} VERSION=${{ steps.ver.outputs.version }} LLAMA_CMAKE_EXTRA="${{ matrix.cmake_extra }}"

      - name: Rename binaries for release
        shell: bash
        run: |
          cp bin/orchestra-runtime${{ matrix.ext }} bin/${{ matrix.artifact }}
          cp bin/orchestra-worker${{ matrix.ext }}  bin/${{ matrix.worker_artifact }}

      - name: Sanity start
        # Boot the binary, confirm /health responds, stop it. Catches missing
        # runtime DLLs/shared libs and CPU baseline mistakes on each platform.
        shell: bash
        run: |
          ORCHESTRA_PORT=8101 ./bin/${{ matrix.artifact }} &
          PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8101/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8101/health
          curl -fsS http://127.0.0.1:8101/api/system
          kill $PID || true

      # We upload both binaries under a single artifact to keep the download
      # step on the release side simple. Names still end up distinct on the
      # GitHub Release page (orchestra-runtime-*, orchestra-worker-*).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            bin/${{ matrix.artifact }}
            bin/${{ matrix.worker_artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten paths
        run: |
          mkdir -p release-assets
          # Each matrix entry uploads under a folder per platform; flatten
          # so release-assets/ contains exactly the files we want as assets.
          find artifacts -type f -maxdepth 2 -exec cp {} release-assets/ \;
          ls -la release-assets/
          # Fail explicitly if nothing made it here — otherwise softprops
          # would publish an empty release.
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No build artifacts produced — aborting release."
            exit 1
          fi

      - name: Compute SHA256 checksums
        run: |
          cd release-assets
          for f in *; do
            shasum -a 256 "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the Release: the channel manifest the apps read, and the operium.ru
  # mirror they download from. The manifest used to be a separate, manual
  # workflow (runtime-channel-manifest.yml, still there for re-publishing an
  # old tag), so a tag produced binaries no app was told about.
  #
  # The channel comes from the tag: vX.Y.Z-canary… → canary, -beta…/-rc… →
  # beta, a plain vX.Y.Z → stable. To verify on canary or beta first, tag with
  # the suffix, then tag the plain version once it is good.
  #
  # The mirror needs the OPERIUM_DEPLOY_SSH_KEY secret. Its public half is on
  # the server as
  #   command="rrsync -wo /home/operium/operium-core/desktop-releases",restrict ssh-ed25519 …
  # so it can only write files under desktop-releases/ (paths below are
  # relative to it) and cannot open a shell. Without the secret the manifest
  # is still committed and the apps download from GitHub.
  manifest:
    name: Channel manifest and operium.ru mirror
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_KEY: ${{ secrets.OPERIUM_DEPLOY_SSH_KEY }}
      SERVER: operium@157.22.194.113
      PUBLIC_URL: https://operium.ru/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Channel from the tag
        run: |
          case "$TAG" in
            *-canary*) channel=canary ;;
            *-beta*|*-rc*) channel=beta ;;
            *) channel=stable ;;
          esac
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "Channel: $channel"

      - name: Download the release
        run: |
          gh release download "$TAG" \
            --pattern 'orchestra-runtime-*' \
            --pattern 'orchestra-worker-*' \
            --dir release-assets
          ls -la release-assets
          gh release view "$TAG" --json name --jq .name > release-name.txt

      - name: Manifest for GitHub downloads
        run: |
          node scripts/generate-runtime-manifest.mjs \
            --channel "$CHANNEL" \
            --version "$TAG" \
            --artifacts-dir release-assets \
            --base-url https://github.com/${{ github.repository }}/releases/download \
            --min-extension-version 0.2.13 \
            --notes "$(cat release-name.txt)" \
            --output "release-manifests/$CHANNEL.json"

      - name: Commit it to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release-manifests/$CHANNEL.json"
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "release: $CHANNEL manifest for $TAG"
            git push origin HEAD:main
          fi

      - name: Mirror to operium.ru
        if: env.DEPLOY_KEY != ''
        run: |
          node scripts/generate-runtime-manifest.mjs \
            --channel "$CHANNEL" \
            --version "$TAG" \
            --artifacts-dir release-assets \
            --base-url "$PUBLIC_URL/updates/runtime" \
            --min-extension-version 0.2.13 \
            --notes "$(cat release-name.txt)" \
            --output "operium/$CHANNEL.json"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/operium
          chmod 600 ~/.ssh/operium
          ssh-keyscan -H "${SERVER#*@}" >> ~/.ssh/known_hosts
          export RSYNC_RSH="ssh -i $HOME/.ssh/operium -o IdentitiesOnly=yes"
          # Binaries first, the manifest last: an app must never read a
          # manifest that points at a file not uploaded yet.
          rsync -rt --mkpath release-assets/ "$SERVER:updates/runtime/$TAG/"
          rsync -t --mkpath "operium/$CHANNEL.json" "$SERVER:download/runtime/$CHANNEL.json"
          version="${TAG#v}"
          curl -fsS "$PUBLIC_URL/download/runtime/$CHANNEL.json" | grep -q "\"runtimeVersion\": \"$version\""
          for file in release-assets/*; do
            curl -fsSI "$PUBLIC_URL/updates/runtime/$TAG/$(basename "$file")" > /dev/null
          done
          echo "Mirrored $TAG to $PUBLIC_URL (channel $CHANNEL)."
